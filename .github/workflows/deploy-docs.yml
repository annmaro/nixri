name: Deploy Documentation Webpage

on:
  push:
    branches:
      - main
    paths:
      - "index.md"
      - "docs/**.md"
      - ".github/workflows/deploy-docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  link-validator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code Repository
        uses: actions/checkout@v6

      - name: Execute Link Consistency Validation
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --accept-empty "./index.md" "./docs/*.md"
          fail: false

  deploy:
    needs: link-validator
    environment:
      name: Production Docs
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code Repository
        uses: actions/checkout@v6

      - name: Install System Compilation Dependencies
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Staging Workspace Asset Transformation
        run: |
          mkdir -p _site/docs 

          # ---> NEW: Copy the images folder to the live website <---
          if [ -d "img" ]; then
            cp -r img _site/img
          fi

          # 1. DEFINE YOUR REUSABLE HTML GENERATOR PIPELINE
          compile_page() {
            local src_file=$1
            local dest_html=$2
            
            # Generate the local body content map for this specific file
            pandoc "$src_file" -f markdown -t html -o _site/content.html

            # Assemble the complete web shell frame with your persistent links embedded
            cat << 'EOF' > "$dest_html"
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>System Documentation Matrix</title>
              <style>
                html { scroll-behavior: smooth; }
                body { background-color: #050505; color: #e0e0e0; font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 0; }
                .page-header { background-color: #0c0c0c; background-image: linear-gradient(120deg, #111, #001a08); border-bottom: 1px solid #222; padding: 3rem 2rem; text-align: center; }
                .page-header h1 { color: #ffffff; margin: 0; font-size: 2.5rem; }
                .page-header p { color: #888; margin: 0.5rem 0 0 0; font-size: 1.1rem; }
                .main-content { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }
                .custom-layout-wrapper { display: flex; flex-direction: column; gap: 2rem; }
                @media (min-width: 800px) { .custom-layout-wrapper { flex-direction: row; align-items: flex-start; } }
                .sidebar-toc-container { background-color: #0d0d0d; border: 1px solid #222; border-radius: 8px; padding: 1.5rem; width: 100%; box-sizing: border-box; }
                @media (min-width: 800px) { .sidebar-toc-container { width: 280px; position: sticky; top: 2rem; max-height: 85vh; overflow-y: auto; } }
                .sidebar-toc-container h3 { margin-top: 0; color: #ffffff; font-size: 1.1rem; border-bottom: 2px solid #00ff66; padding-bottom: 0.5rem; }
                
                .sidebar-wiki-links {
                  padding-bottom: 0.5rem;
                  margin-bottom: 0.5rem;
                }
                .sidebar-wiki-links ul { list-style-type: none; padding-left: 0; margin: 0; }
                .sidebar-wiki-links li { margin-bottom: 0.75rem; font-size: 1rem; }
                .sidebar-wiki-links a { color: #ffffff !important; font-weight: 500; text-decoration: none; }
                .sidebar-wiki-links a:hover { color: #00ff66 !important; }

                .main-article-content { flex: 1; width: 100%; min-width: 0; }
                h1, h2, h3, h4 { color: #00ff66; border-bottom: 1px solid #222; padding-bottom: 0.3rem; margin-top: 2rem; }
                pre { background-color: #111; border: 1px solid #333; padding: 1rem; overflow-x: auto; border-radius: 6px; }
                code { background-color: #111; color: #50fa7b; font-family: monospace; padding: 0.2rem 0.4rem; border-radius: 4px; }
                pre code { padding: 0; color: #50fa7b; background-color: transparent; }
                a { color: #00a3ff; text-decoration: none; }
                a:hover { text-decoration: underline; }
                table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
                th, td { border: 1px solid #333; padding: 0.75rem; text-align: left; }
                th { background-color: #111; color: #00ff66; }
                /* Constrain large screenshots but allow inline badges */
                .main-article-content img {
                  max-width: 100%;
                  height: auto;
                  border-radius: 6px;
                }
                
                /* Target paragraph images (screenshots) to make them block-level */
                .main-article-content p > img {
                  max-height: 400px; /* Adjust height here */
                  border: 1px solid #333;
                  margin: 1rem 0;
                  display: block;
                }
                
                /* Ensure links wrapping images (like your badges) stay inline */
                .main-article-content a > img {
                  display: inline-block;
                  border: none;
                  margin: 0 0.2rem;
                  max-height: none;
                }
              </style>
            </head>
            <body>
              <header class="page-header">
                <h1>System Documentation Matrix</h1>
                <p>Declarative NixOS Profile Production Deployment Configurations</p>
              </header>
              <div class="main-content">
                <div class="custom-layout-wrapper">
                  <nav class="sidebar-toc-container">
                    <h3>🗺️ Navigation</h3>
                    
                    <div class="sidebar-wiki-links">
                      <ul>
                        <li>🏠 <a href="/nixri/index.html">NixOS Overview (Home)</a></li>
                        <li>📖 <a href="/nixri/docs/readme.html">Installation & Usage</a></li>
                        <li>💿 <a href="/nixri/docs/installer.html">Installer Script</a></li>
                        <li>✨ <a href="/nixri/docs/stylix.html">Stylix Theming</a></li>
                        <li>🎛️ <a href="/nixri/docs/variables.html">System Variables</a></li>
                        <li>🚀 <a href="/nixri/docs/boot.html">Boot Config</a></li>
                        <li>🖥️ <a href="/nixri/docs/system.html">System Config</a></li>
                        <li>🛠️ <a href="/nixri/docs/services.html">Services Config</a></li>
                        <li>🐚 <a href="/nixri/docs/fish.html">Fish Config</a></li>
                        <li>🌐 <a href="/nixri/docs/browser.html">Browser Config</a></li>
                        <li>🔮 <a href="/nixri/docs/niri.html">Niri Config</a></li>
                        <li>🎨 <a href="/nixri/docs/dms.html">Dank Material Shell</a></li>
                        <li>⚙️ <a href="/nixri/docs/core.html">Core Modules</a></li>
                        <li>🔍 <a href="/nixri/docs/rofi.html">Rofi Config</a></li>
                        <li>📝 <a href="/nixri/docs/neovim.html">Neovim Config</a></li>
                        <li>🔐 <a href="/nixri/docs/sops-rclone-git.html">Security & Deployment</a></li>
                        <li>🎵 <a href="/nixri/docs/audio.html">Audio Suite</a></li>
                      </ul>
                    </div>
                  </nav>
                  <main class='main-article-content'>
          EOF

          # 2. MERGE CONTENT AND CLOSE THE HTML ENVELOPE
          cat _site/content.html >> "$dest_html"
          echo -e "</main>\n</div>\n</div>\n</body>\n</html>" >> "$dest_html"

          rm _site/content.html
          }

          # 3. TRIGGER COMPILATION ACROSS REPOSITORY ASSETS
          compile_page "index.md" "_site/index.html"

          if [ -d "docs" ]; then
            for f in docs/*.md; do
              if [ -f "$f" ]; then
                filename=$(basename "$f" .md)
                compile_page "$f" "_site/docs/${filename}.html"
              fi
            done
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
